<mat-toolbar>
  <span class="txt-logo"> <strong>WIX</strong></span>
</mat-toolbar>
<main>
  <mat-card>
    <mat-card-header>
      <mat-card-title>Sign Up</mat-card-title>
      <mat-card-subtitle
        >Already have an account? <a href="#">Log in</a></mat-card-subtitle
      >
    </mat-card-header>
  </mat-card>
  <mat-card>
    <form (submit)="signup(submitForm)" #submitForm="ngForm">
      <mat-form-field appearance="fill">
        <mat-label>Email</mat-label>
        <input
          matInput
          type="email"
          name="email"
          ngModel
          #email="ngModel"
          required
        />
        <mat-error *ngIf="email.invalid">Email is required</mat-error>
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>Confirm Email</mat-label>
        <input
          matInput
          type="email"
          name="confirmEmail"
          ngModel
          #confirmEmail="ngModel"
          required
        />
        <mat-error *ngIf="confirmEmail.invalid"
          >Email Confirmation is required</mat-error
        >
      </mat-form-field>

      <mat-form-field appearance="fill">
        <mat-label>Password</mat-label>
        <input
          matInput
          type="password"
          name="password"
          ngModel
          #password="ngModel"
          required
        />
        <mat-error *ngIf="password.invalid">Password is required</mat-error>
      </mat-form-field>
      <mat-form-field appearance="fill">
        <mat-label>Confirm Password</mat-label>
        <input
          matInput
          type="password"
          name="confirmPassword"
          ngModel
          required
        />
        <mat-error *ngIf="confirmPassword.invalid"
          >Password Confirmation is required</mat-error
        >
      </mat-form-field>
      <button mat-raised-button color="primary" type="submit">Sign Up</button>
    </form>
  </mat-card>
</main>
